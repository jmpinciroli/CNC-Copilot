<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Copilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>CNC Copilot</h1>

    <div class="card">

        <h2>Nueva Programación</h2>

        <label>Operación</label>
        <select id="operacion">
            <option>Cilindrado</option>
            <option>G71</option>
            <option>G76</option>
        </select>

        <label>Material</label>
        <select id="material">
            <option value="SAE1045">SAE1045</option>
            <option value="SAE1020">SAE1020</option>
            <option value="AISI304">AISI304</option>
            <option value="AISI316">AISI316</option>
            <option value="SAE4140">SAE4140</option>
            <option value="ALUMINIO6061">ALUMINIO6061</option>
        </select>

        <label>Herramienta</label>
        <select id="herramienta">
            <option value="CNMG120408">CNMG120408</option>
            <option value="DNMG150608">DNMG150608</option>
            <option value="MGMN300">MGMN300</option>
        </select>

        <label>Diámetro Inicial</label>
        <input id="diametroInicial" type="number">

        <label>Diámetro Final</label>
        <input id="diametroFinal" type="number">

        <label>Longitud</label>
        <input id="longitud" type="number">

        <button onclick="generarCodigo()">
            Generar Código G
        </button>
        
        <div id="datosProceso"></div>

    </div>

    <div class="resultado">

        <h2>Resultado</h2>

        <pre id="codigo"></pre>

    </div>

</div>

app.jsscript>

</body>
</html>
