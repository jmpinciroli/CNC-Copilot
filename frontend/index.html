<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Copilot</title>

    style.css
</head>

<body>

<div class="container">

    <h1>CNC Copilot</h1>

    <div class="card">

        <h2>Nueva Programación</h2>

        <label>Operación</label>
        <select id="operacion">
            <option>Cilindrado</option>
            <option>G71</option>
            <option>G76</option>
        </select>

        <label>Diámetro Inicial</label>
        <input id="diametroInicial" type="number">

        <label>Diámetro Final</label>
        <input id="diametroFinal" type="number">

        <label>Longitud</label>
        <input id="longitud" type="number">

        <button onclick="generarCodigo()">
            Generar Código G
        </button>

    </div>

    <div class="resultado">

        <h2>Resultado</h2>

        <pre id="codigo"></pre>

    </div>

</div>

app.jsscript>

</body>
</html>
